plugins {
    id 'com.android.application'
}

// Native code (game, SDL2, Lua, ENet, OpenXR host) is built by quest/CMakeLists.txt.
// Game data is NOT packed into the APK: it lives in /sdcard/Forsaken/data (copied by the player).
// Small APK: the player copies it there. Full APK (-PgameData=...): unpacked there on first start.

android {
    namespace 'com.bilko.forsakenvr'
    compileSdk 34
    ndkVersion '27.2.12479018'

    defaultConfig {
        applicationId 'com.bilko.forsakenvr'
        minSdk 29
        targetSdk 32
        versionCode 2
        versionName '0.1.1-beta'

        ndk {
            abiFilters 'arm64-v8a'
        }

        externalNativeBuild {
            cmake {
                arguments '-DANDROID_STL=c++_shared'
                targets 'main'
            }
        }
    }

    externalNativeBuild {
        cmake {
            path '../CMakeLists.txt'
            version '3.22.1'
            buildStagingDirectory '../../build-gradle'
        }
    }

    buildFeatures {
        prefab true
        buildConfig true
    }

    androidResources {
        // the default pattern silently drops files starting with '_' or '.'
        ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:!CVS:!thumbs.db:!picasa.ini:!*~'
    }

    lint {
        // targetSdk 32 is deliberate (Quest sideload, legacy storage behaviour); not a Play Store build.
        checkReleaseBuilds false
        abortOnError false
    }

    buildTypes {
        debug {
            debuggable true
            jniDebuggable true
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    sourceSets {
        main {
            // SDL's Java side (SDLActivity etc.) straight from the SDL submodule.
            java.srcDirs += '../external/SDL/android-project/app/src/main/java'
            assets.srcDirs += layout.buildDirectory.dir( 'generated/fxassets' )
        }
    }

    packagingOptions {
        jniLibs {
            useLegacyPackaging true
        }
    }
}

dependencies {
    implementation 'org.khronos.openxr:openxr_loader_for_android:1.1.62'
}

// Files installed to /sdcard/Forsaken on start (fx_android.c): scripts/ from the game sources,
// configs/ + pilots/ from quest/defaults, and with -PgameData=<forsaken-data checkout> the game
// data as data/ (full APK). fxfiles.idx lists every file as "<size>\t<path>" because native code
// can't list asset subfolders.
def fxAssetsDir = layout.buildDirectory.dir( 'generated/fxassets' )
tasks.register( 'fxAssets', Sync ) {
    into fxAssetsDir
    from( '../../scripts' ) { into 'fx/scripts' }
    from( '../defaults' ) { into 'fx' }
    if( project.hasProperty( 'gameData' ) )
        from( project.property( 'gameData' ) ) {
            into 'fx/data'
            exclude '.git', '.git/**', 'README.md', 'LICENSE'
        }
    inputs.property( 'gameData', project.findProperty( 'gameData' ) ?: '' )
    doLast {
        def root = fxAssetsDir.get().dir( 'fx' ).asFile
        def lines = []
        root.eachFileRecurse( groovy.io.FileType.FILES ) { f ->
            lines << "${f.length()}\t${root.toPath().relativize( f.toPath() ).toString().replace( '\\', '/' )}"
        }
        lines.sort()
        fxAssetsDir.get().file( 'fxfiles.idx' ).asFile.text = lines.join( '\n' ) + '\n'
    }
}
preBuild.dependsOn 'fxAssets'
