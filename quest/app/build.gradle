plugins {
    id 'com.android.application'
}

// Native code (game, SDL2, Lua, ENet, OpenXR host) is built by quest/CMakeLists.txt.
// Game data is NOT packed into the APK: it lives in /sdcard/Forsaken/data (copied by the player).
// The game's scripts and the Quest default settings are packed as assets and installed to
// /sdcard/Forsaken on first start (ForsakenActivity).

android {
    namespace 'com.bilko.forsakenvr'
    compileSdk 34
    ndkVersion '27.2.12479018'

    defaultConfig {
        applicationId 'com.bilko.forsakenvr'
        minSdk 29
        targetSdk 32
        versionCode 1
        versionName '0.1.0-beta'

        ndk {
            abiFilters 'arm64-v8a'
        }

        externalNativeBuild {
            cmake {
                arguments '-DANDROID_STL=c++_shared'
                targets 'main'
            }
        }
    }

    externalNativeBuild {
        cmake {
            path '../CMakeLists.txt'
            version '3.22.1'
            buildStagingDirectory '../../build-gradle'
        }
    }

    buildFeatures {
        prefab true
        buildConfig true
    }

    lint {
        // targetSdk 32 is deliberate (Quest sideload, legacy storage behaviour); not a Play Store build.
        checkReleaseBuilds false
        abortOnError false
    }

    buildTypes {
        debug {
            debuggable true
            jniDebuggable true
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    sourceSets {
        main {
            // SDL's Java side (SDLActivity etc.) straight from the SDL submodule.
            java.srcDirs += '../external/SDL/android-project/app/src/main/java'
            assets.srcDirs += layout.buildDirectory.dir( 'generated/fxassets' )
        }
    }

    packagingOptions {
        jniLibs {
            useLegacyPackaging true
        }
    }
}

dependencies {
    implementation 'org.khronos.openxr:openxr_loader_for_android:1.1.62'
}

// scripts/ from the game sources, configs/ + pilots/ from quest/defaults -> APK assets.
tasks.register( 'fxAssets', Sync ) {
    into layout.buildDirectory.dir( 'generated/fxassets' )
    from( '../../scripts' ) { into 'scripts' }
    from( '../defaults' )
}
preBuild.dependsOn 'fxAssets'
